<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with me. Contact form with accessible fields.">
    <title>Contact - Vamsi's Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Vamsi's Portfolio</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact Me</h1>
            
            <form aria-label="Contact form">
                <!-- NAME FIELD -->
                <div>
                    <label for="name">Full Name <span aria-label="required">*</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        aria-required="true"
                    >
                </div>

                <!-- EMAIL FIELD -->
                <div>
                    <label for="email">Email <span aria-label="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        aria-required="true"
                    >
                </div>

                <!-- MESSAGE FIELD -->
                <div>
                    <label for="message">Message <span aria-label="required">*</span></label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="5" 
                        required 
                        aria-required="true"
                    ></textarea>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vamsi. All rights reserved.</p>
    </footer>
</body>
</html>
